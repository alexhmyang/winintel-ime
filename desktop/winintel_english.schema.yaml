schema:
  schema_id: winintel_english
  name: winintel English dictionary
  version: "0.1.0"
engine:
  processors:
    - speller
    - selector
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator
translator:
  dictionary: winintel_english
  enable_user_dict: false
  enable_completion: true
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
